<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/opt/homebrew/etc/fonts/fonts.conf</include>
  <dir>/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/previewer/common/bin/fonts</dir>
  <dir>/Applications/wpsoffice.app/Contents/Resources/office6/fonts</dir>
  <match target="pattern">
    <test name="family" qual="any"><string>CUMCMSong</string></test>
    <edit name="family" mode="assign" binding="strong"><string>ShuS-SC</string></edit>
  </match>
</fontconfig>
